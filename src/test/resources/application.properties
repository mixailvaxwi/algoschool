# Значения для тестов.
#
# Обязательные переменные окружения проверяются RequiredEnvironmentPostProcessor
# ещё до старта контекста, поэтому срезовым тестам (им никакая БД не нужна)
# всё равно требуются непустые значения.
#
# Форма ${ПЕРЕМЕННАЯ:значение-по-умолчанию} оставляет приоритет за окружением:
# интеграционные тесты (-Pintegration) получают настоящие DB_PASSWORD и
# JWT_SECRET, а обычные обходятся значениями ниже.

spring.datasource.password=${DB_PASSWORD:test-password}

# Base64 от "test-secret-that-is-long-enough-for-hs256-signing!"
app.jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTYtc2lnbmluZyE=}
