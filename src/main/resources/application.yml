spring:
  application:
    name: algoschool

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/algoschool?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Схемой управляет Flyway (src/main/resources/db/migration).
  # baseline-on-migrate нужен для баз, созданных ещё через ddl-auto=update:
  # V1 помечается применённой без выполнения, изменения едут с V2.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # validate, а не update: Hibernate больше не правит схему молча,
      # он лишь сверяет её с сущностями и падает при расхождении.
      ddl-auto: validate
    show-sql: true

# Секреты берутся из переменных окружения — см. .env.example.
# У DB_PASSWORD и JWT_SECRET нет значений по умолчанию: без них приложение не стартует.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 часа в миллисекундах

ejudge:
  base-url: ${EJUDGE_BASE_URL:http://localhost}
  # Пустой по умолчанию, чтобы можно было поднять приложение локально без Ejudge.
  api-key: ${EJUDGE_API_KEY:}
  bot-login: ${EJUDGE_BOT_LOGIN:ejudge}
