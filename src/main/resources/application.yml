spring:
  application:
    name: algoschool

  # Профиль по умолчанию — dev. В проде: SPRING_PROFILES_ACTIVE=prod
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/algoschool?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Схемой управляет Flyway (src/main/resources/db/migration).
  # baseline-on-migrate нужен для баз, созданных ещё через ddl-auto=update:
  # V1 помечается применённой без выполнения, изменения едут с V2.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # validate, а не update: Hibernate больше не правит схему молча,
      # он лишь сверяет её с сущностями и падает при расхождении.
      ddl-auto: validate
    # show-sql переопределяется профилями (в проде выключен)
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # Не отдаём наружу стектрейсы: ошибки описывает GlobalExceptionHandler
    include-stacktrace: never
    include-message: never

# Секреты берутся из переменных окружения — см. .env.example.
# У DB_PASSWORD и JWT_SECRET нет значений по умолчанию: без них приложение не стартует.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 часа в миллисекундах

ejudge:
  base-url: ${EJUDGE_BASE_URL:http://localhost}
  # Пустой по умолчанию, чтобы можно было поднять приложение локально без Ejudge.
  api-key: ${EJUDGE_API_KEY:}
  bot-login: ${EJUDGE_BOT_LOGIN:ejudge}

  # Таймауты обязательны: без них недоступный Ejudge держал поток планировщика
  # (а раньше — и открытую транзакцию) неограниченно долго.
  connect-timeout-ms: 3000
  read-timeout-ms: 10000

  # lang_id раньше был зашит в коде как "3" (Java). Значения зависят от
  # конкретной установки Ejudge — сверьтесь со своей и дополните список.
  default-lang-id: 3
  language-ids:
    java: 3

  polling:
    # Выключите, если Ejudge не поднят: иначе опрос пишет предупреждение
    # каждый интервал.
    enabled: ${EJUDGE_POLLING_ENABLED:true}
    interval-ms: 3000
